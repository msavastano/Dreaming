[project]
name = "lorekeeper"
version = "0.1.0"
description = "A fantasy game master that remembers your campaign, built to test layered agent memory and dreaming."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "google-genai>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lorekeeper = "lorekeeper.play:main"
lorekeeper-web = "lorekeeper.web:main"

[tool.setuptools]
packages = ["lorekeeper"]

[tool.setuptools.package-data]
lorekeeper = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
