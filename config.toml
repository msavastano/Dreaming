# Lorekeeper settings. API keys come from the environment:
#   GEMINI_API_KEY (or GOOGLE_API_KEY) for Gemini, ANTHROPIC_API_KEY for Claude.

[narration]
# Which provider narrates each turn: "gemini" (default, cheapest) or "claude".
provider = "gemini"
max_output_tokens = 2000
# At most this many recent turns go into each prompt. Older turns are found
# by search and recall instead.
window_turns = 20
# The oldest shown turn moves forward this many turns at a time, so the start
# of the prompt stays the same for a while and caching can reuse it.
# The game master sees between (window_turns - window_step) and window_turns turns.
window_step = 10
# How many rounds of tool calls (remember, search_memory) the game master may
# make in one turn before it must answer. Each round is one more model call.
max_tool_rounds = 3
# How many of the most recent notes go into every prompt. Older notes are
# still found by search_memory.
notes_in_prompt = 40
# Before each turn the game searches notes and old turns for the player's words
# (locally, no API call) and adds up to this many matches to the prompt, so the
# game master sees old details without having to search. 0 turns it off.
recall_hits = 3
# Each recalled match is cut to this many characters to keep the prompt small.
recall_chars = 400

[dream]
# Dreaming runs after play, so it can afford a little more thinking than narration.
provider = "claude"        # "claude" (Haiku) or "gemini"
effort = "medium"          # Claude effort for dreaming
thinking_level = "MEDIUM"  # Gemini thinking level for dreaming
# Dream when you quit if at least this many turns are new. /dream ignores it.
min_turns = 10
on_quit = true
# Turns per dream call. A long backlog is dreamed in several calls.
chunk_turns = 25
# Haiku and Gemini think before answering, and thinking counts against this limit.
max_output_tokens = 16000
# At most this many wiki pages appear in the cast list in canon.md.
cast_limit = 60

[gemini]
model = "gemini-3.8-flash"
# MINIMAL, LOW, MEDIUM or HIGH. Lower is cheaper and faster.
thinking_level = "LOW"

[claude]
model = "claude-haiku-5-5"
# low, medium, high, xhigh or max. Lower is cheaper and faster.
effort = "low"

[budget]
# Play stops for the day once this many tokens (input + output, all providers)
# have been used. Counted from usage.jsonl in the campaign folder.
# About 600k tokens is roughly 6 to 8 cents a day on Haiku 5.5.
daily_token_cap = 600_000
